services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: draftroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "314:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/draftroom
      PORT: 314
    ports:
      - "314:314"
      - "324:314"
      - "334:314"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:314/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
