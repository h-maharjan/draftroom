services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: draftroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"        # host 5433 -> container 5432, avoids collision with other postgres containers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/draftroom   # internal port stays 5432, unrelated to host mapping above
      PORT: 314
    ports:
      - "3140:314"          # host 3140 -> container 314
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:314/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata: